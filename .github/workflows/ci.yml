name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched tools
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-format-${{ hashFiles('.clang-format', '.clang-format-include', 'cmake/addclangformat.cmake') }}
          restore-keys: |
            ${{ runner.os }}-format-

      - name: Configure formatter
        run: >
          cmake -S . -B build-format
          -DARCHIMEDES_FORMAT=ON
          -DARCHIMEDES_BUILD_TESTBED=OFF
          -DARCHIMEDES_BUILD_TESTING=OFF
          -DARCHIMEDES_BUILD_BENCHMARK=OFF

      - name: Check formatting
        run: cmake --build build-format --target format-check

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # warnings_as_errors turns ARCHIMEDES_WARNINGS_AS_ERRORS on (/WX, -Werror) for
      # archimedes' own targets. Only the MSVC lane has been verified clean so far; the
      # GCC and Clang lanes build with -Wall -Wextra but do not fail on warnings yet.
      matrix:
        include:
          - name: Linux Release
            os: ubuntu-24.04
            build_type: Release
            install_linux_deps: true
            warnings_as_errors: "OFF"

          - name: Linux Debug
            os: ubuntu-24.04
            build_type: Debug
            install_linux_deps: true
            warnings_as_errors: "OFF"

          - name: macOS Release
            os: macos-15
            build_type: Release
            install_linux_deps: false
            warnings_as_errors: "OFF"

          - name: Windows Release
            os: windows-2022
            build_type: Release
            install_linux_deps: false
            warnings_as_errors: "ON"

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'test/CMakeLists.txt', 'testbed/CMakeLists.txt', 'bench/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install Linux windowing dependencies
        if: ${{ matrix.install_linux_deps }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Configure library-only
        run: >
          cmake -S . -B build-lib
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DARCHIMEDES_FORMAT=OFF
          -DARCHIMEDES_WARNINGS_AS_ERRORS=${{ matrix.warnings_as_errors }}
          -DARCHIMEDES_BUILD_TESTBED=OFF
          -DARCHIMEDES_BUILD_TESTING=OFF
          -DARCHIMEDES_BUILD_BENCHMARK=OFF

      - name: Build library-only
        run: cmake --build build-lib --parallel --config ${{ matrix.build_type }}

      - name: Configure full build
        run: >
          cmake -S . -B build-full
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DARCHIMEDES_FORMAT=OFF
          -DARCHIMEDES_WARNINGS_AS_ERRORS=${{ matrix.warnings_as_errors }}

      - name: Build full graph
        run: cmake --build build-full --parallel --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build-full --output-on-failure -C ${{ matrix.build_type }}

  # The suite under the Khronos validation layer, required: test/main.cpp turns validation
  # on for every instance, a validation error fails the test case that caused it, and with
  # ARCHIMEDES_TEST_VALIDATION=REQUIRE a layer the loader cannot find fails every [gpu]
  # test instead of letting the lane test nothing.
  validation:
    name: Linux validation
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'test/CMakeLists.txt', 'testbed/CMakeLists.txt', 'bench/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # The tests link the loader built from the ARCHIMEDES_VULKAN_SDK pin, so the layer is
      # built from the same Khronos SDK tag: noble's vulkan-validationlayers package is
      # 1.3.275, far behind the pinned 1.4 headers and loader and missing the checks added
      # since.
      - name: Read the pinned Vulkan SDK
        id: sdk
        run: |
          version=$(sed -n 's/^set(ARCHIMEDES_VULKAN_SDK "\([^"]*\)".*/\1/p' cmake/acmVulkan.cmake)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the validation layer
        id: vvl-cache
        uses: actions/cache@v4
        with:
          path: .cache/vvl
          key: ${{ runner.os }}-vvl-${{ steps.sdk.outputs.version }}

      # UPDATE_DEPS fetches the layer's own pinned dependencies (known_good.json) at
      # configure time; the first run builds for a while, later runs restore the cache.
      - name: Build the validation layer
        if: steps.vvl-cache.outputs.cache-hit != 'true'
        env:
          VVL_TAG: vulkan-sdk-${{ steps.sdk.outputs.version }}
        run: |
          git clone --depth 1 --branch "$VVL_TAG" https://github.com/KhronosGroup/Vulkan-ValidationLayers.git "$RUNNER_TEMP/vvl-src"
          cmake -S "$RUNNER_TEMP/vvl-src" -B "$RUNNER_TEMP/vvl-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DUPDATE_DEPS=ON \
            -DBUILD_WERROR=OFF \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/.cache/vvl"
          cmake --build "$RUNNER_TEMP/vvl-build" --parallel
          cmake --install "$RUNNER_TEMP/vvl-build"

      # The installed manifest names its library bare (libVkLayer_khronos_validation.so):
      # the loader finds the manifest through VK_ADD_LAYER_PATH (added to its explicit-layer
      # search paths), and dlopen finds the library through LD_LIBRARY_PATH.
      - name: Expose the validation layer to the loader
        run: |
          manifest=$(find "$GITHUB_WORKSPACE/.cache/vvl" -name VkLayer_khronos_validation.json -print -quit)
          library=$(find "$GITHUB_WORKSPACE/.cache/vvl" -name libVkLayer_khronos_validation.so -print -quit)
          test -n "$manifest"
          test -n "$library"
          echo "VK_ADD_LAYER_PATH=$(dirname "$manifest")" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$library")${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          grep -E '"(name|api_version|implementation_version|library_path)"' "$manifest"

      - name: Configure full build
        run: >
          cmake -S . -B build-validation
          -DCMAKE_BUILD_TYPE=Debug
          -DARCHIMEDES_FORMAT=OFF
          -DARCHIMEDES_TEST_VALIDATION=REQUIRE

      - name: Build full graph
        run: cmake --build build-validation --parallel

      - name: Test with validation required
        run: ctest --test-dir build-validation --output-on-failure

      # Synchronization validation (the layer's validate_sync setting) reports hazards the
      # core checks cannot see, such as write-after-read across frames. Informational: it
      # runs even when the step above failed and never fails the job.
      - name: Test with synchronization validation (informational)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "1"
        run: ctest --test-dir build-validation --output-on-failure

  # The suite under ThreadSanitizer on the SwiftShader CPU device (the runner has no GPU).
  # ARCHIMEDES_SANITIZE instruments archimedes, its tests and benchmarks but not the
  # vendored dependencies; the uninstrumented driver is covered by test/tsan.supp, which
  # the test binary reads itself.
  tsan:
    name: Linux TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cache/fetch
          key: ${{ runner.os }}-deps-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', 'test/CMakeLists.txt', 'testbed/CMakeLists.txt', 'bench/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      # The loader build needs the windowing headers.
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # ubuntu-24.04 runners randomise mmap with more address bits than the ThreadSanitizer
      # runtime of the image's Clang expects ("FATAL: ThreadSanitizer: unexpected memory
      # mapping"). Needed before the build too: test discovery runs the instrumented binary.
      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DARCHIMEDES_FORMAT=OFF
          -DARCHIMEDES_BUILD_TESTBED=OFF
          -DARCHIMEDES_SANITIZE=thread

      - name: Build
        run: cmake --build build-tsan --parallel

      # A race report makes the test process exit non-zero (TSan's exitcode 66), failing it.
      - name: Test on the CPU device
        env:
          SWIFTSHADER_THREAD_COUNT: "4"
          TSAN_OPTIONS: second_deadlock_stack=1
        run: ctest --test-dir build-tsan --output-on-failure

  subproject:
    name: add_subdirectory smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .github/subproject-smoke/.cache/fetch
          key: ${{ runner.os }}-subproject-runtime-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake', '.github/subproject-smoke/*') }}
          restore-keys: |
            ${{ runner.os }}-subproject-runtime-

      # The parent provisions the Vulkan runtime itself (loader, staged drivers), and the
      # loader build needs the windowing headers.
      - name: Install Linux windowing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Configure parent project
        run: >
          cmake -S .github/subproject-smoke -B build-subproject
          -DCMAKE_BUILD_TYPE=Release
          -DARCHIMEDES_SOURCE_DIR=${{ github.workspace }}

      - name: Build parent project
        run: cmake --build build-subproject --parallel

      - name: Run the parent's binary on the staged CPU driver
        run: |
          ./build-subproject/parent-runtime-smoke
          test -f build-subproject/vulkan/vk_swiftshader_icd.json
          test -f build-subproject/vulkan/vk_swiftshader.LICENSE.txt
          test -f build-subproject/vulkan/vk_swiftshader.THIRD_PARTY_LICENSES.txt
